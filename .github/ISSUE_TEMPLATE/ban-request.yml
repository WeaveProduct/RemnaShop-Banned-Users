name: Добавить в бан-лист
description: Числовой Telegram ID нарушителя с причиной и подтверждением
title: "[ban] <telegram_id> — <краткая причина>"
labels: ["ban-request"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ Без подтверждения заявка не рассматривается.
        > Нужны числовой Telegram ID (не username) и ссылка/скриншот/лог.

  - type: input
    id: telegram_id
    attributes:
      label: Telegram ID
      description: Только цифры, например `7654321098`
      placeholder: "7654321098"
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: Username (если известен)
      placeholder: "@username"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Нарушение
      options:
        - Абуз триалов
        - Шаринг подписки
        - Скам и возвраты
        - Спам и реклама
        - Неадекватное поведение
        - Подозрительный трафик
        - Другое
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Что произошло
      description: Коротко и по делу. Что именно нарушил пользователь.
      placeholder: "12 пробников с одного HWID за сутки"
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Подтверждение
      description: Ссылки на сообщения, скриншоты, выдержки из логов панели.
      placeholder: "https://t.me/c/.../... + скриншот из логов"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Подтверждение
      options:
        - label: Я понимаю, что заявка публикуется открыто и будет проверена
          required: true
